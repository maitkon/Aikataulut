<!DOCTYPE html>
<html lang="fi">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>18 Pikkupiiankatu (4576) Aikataulut KESÄ (1.6.–4.8.2026)</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
}

/* Pääotsikko */
.main-title {
    background-color: #025CAE;
    color: white;
    padding: 10px;
    text-align: center;
    font-size: 20px;
    margin-bottom: 20px;
}

/* Päiväotsikot */
.section-title {
    margin-top: 20px;
    margin-bottom: 5px;
    font-weight: bold;
    font-size: 18px;
}

/* Taulukko */
table.aikataulu {
    width: 100%;
    max-width: 100%;        /* 🔥 Pakottaa taulukon skaalautumaan */
    border-collapse: collapse;
    margin-bottom: 10px;
}

/* Solujen perusulkoasu */
.cell {
    border: 1px solid #444;
    text-align: center;
    height: 32px;
    padding: 6px;
    width: auto;
    font-size: 16px;
}

/* KLO-solu */
.klo {
    width: 8%;
    background-color: #025CAE;
    color: white;
    border-bottom: 2px solid white;
    font-weight: bold;
}

/* Minuuttisolut */
.min {
    width: 8%;
    background-color: white;
    color: black;
}

/* Otsikkosolut */
.klo-head {
    background-color: #025CAE;
    color: white;
    border-bottom: 2px solid white;
}

.min-head {
    background-color: #025CAE;
    color: white;
}

/* PDF-tulostus */
@media print {

    .cell {
        font-size: 18px;
        padding: 6px;
    }

    .klo {
        font-size: 18px;
        font-weight: bold;
    }

    .main-title {
        font-size: 22px;
    }

    .section-title {
        font-size: 20px;
    }

    table.aikataulu {
        page-break-inside: avoid;
    }
}

/* MOBIILIVERSIO (kapeat näytöt) */
@media screen and (max-width: 900px) {

    * {
        box-sizing: border-box;
    }

    html, body {
        max-width: 100% !important;
        overflow-x: hidden;
    }

    table.aikataulu {
        width: 100% !important;
        table-layout: fixed !important;   /* 🔥 Estää taulukkoa venymästä */
    }

    body {
        margin: 10px;
        font-size: 18px;
    }

    .main-title {
        font-size: 24px;
        padding: 14px;
    }

    .section-title {
        font-size: 22px;
        margin-top: 15px;
    }

    /* Piilotetaan otsikkorivi */
    table.aikataulu thead,
    table.aikataulu tr:first-child {
        display: none;
    }

    /* Jokainen tuntirivi kortiksi */
    table.aikataulu tr {
        display: block;
        border: 1px solid #ccc;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 12px;
        background-color: #f9f9f9;
    }

    /* KLO ylös isolla fontilla */
    .klo {
        display: block;
        width: 100%;
        text-align: left;
        font-size: 24px;
        margin-bottom: 8px;
        background-color: transparent;
        color: #025CAE;
        border-bottom: none;
        font-weight: bold;
    }

    /* Minuutit pillereiksi */
    .min {
        display: inline-block;
        width: auto;
        min-width: 45px;
        text-align: center;
        font-size: 20px;
        margin-right: 8px;
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 6px 8px;
    }

    .min.small-font {
        font-size: 19px;
    }

    .min.xsmall-font {
        font-size: 18px;
    }
}

<h2 class="main-title">
    18 Pikkupiiankatu (4576) Aikataulut KESÄ (1.6.–4.8.2026)
</h2>

<div class="section-title">Maanantai – Perjantai</div>
<table class="aikataulu" id="tbl-mape">
    <tr>
        <th class="cell klo-head">KLO</th>
        <th class="cell min-head" colspan="4">Minuutit</th>
    </tr>
</table>

<div class="section-title">Lauantai</div>
<table class="aikataulu" id="tbl-la">
    <tr>
        <th class="cell klo-head">KLO</th>
        <th class="cell min-head" colspan="4">Minuutit</th>
    </tr>
</table>

<div class="section-title">Sunnuntai</div>
<table class="aikataulu" id="tbl-su">
    <tr>
        <th class="cell klo-head">KLO</th>
        <th class="cell min-head" colspan="4">Minuutit</th>
    </tr>
</table>

<script>
function loadCsvToTable(csvFile, tableId) {
    fetch(csvFile)
        .then(r => r.text())
        .then(text => {
            const rows = text.trim().split(/\r?\n/);
            const table = document.getElementById(tableId);

            rows.forEach(line => {
                const cols = line.split(",");
                const tr = document.createElement("tr");

                // Tunti (KLO-sarake)
                const tdKlo = document.createElement("td");
                tdKlo.className = "cell klo";
                tdKlo.textContent = cols[0] || "";
                tr.appendChild(tdKlo);

                // Minuutit (max 4 solua)
                for (let i = 1; i <= 4; i++) {
                    const tdMin = document.createElement("td");
                    tdMin.className = "cell min";
                    tdMin.textContent = cols[i] || "";
                    tr.appendChild(tdMin);
                }

                table.appendChild(tr);
            });
        })
        .catch(err => {
            console.error("CSV-lataus epäonnistui:", csvFile, err);
        });
}

// Lataa kolme eri CSV-tiedostoa
loadCsvToTable("aikataulu_mape.csv", "tbl-mape");
loadCsvToTable("aikataulu_la.csv", "tbl-la");
loadCsvToTable("aikataulu_su.csv", "tbl-su");
</script>

</body>
</html>
