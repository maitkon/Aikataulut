<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linja-aikataulu</title>

    <!-- Ulkoinen normaali ulkoasu -->
    <link rel="stylesheet" href="styles.css">

    <!-- Tulostusystävällinen CSS -->
    <link rel="stylesheet" href="print.css" media="print">

    <!-- JavaScript -->
    <script src="script.js" defer></script>

    <!-- Sisäinen CSS (jos haluat pitää tämän mukana) -->
    <style>
        :root {
          --dark-blue: #015CAD;
          --white: #ffffff;
          --black: #000000;
          --gray-bg: #f4f4f4;
        }

        body {
          font-family: Arial, sans-serif;
          margin: 0;
          padding: 20px;
          background-color: var(--gray-bg);
        }

        /* Otsikkopalkki */
        .linja-otsikko {
          background-color: var(--dark-blue);
          color: var(--white);
          padding: 20px;
          text-align: center;
          border-radius: 8px;
          margin-bottom: 30px;
        }

        /* Tunti-solun parannettu tyyli */
        td.tunti-solu {
          background-color: var(--dark-blue);
          color: var(--white);
          font-weight: bold;
          width: 15%;
          border-bottom: 3px solid var(--white);
        }

        /* Minuuttisolut */
        td.minuutti-solu {
          background-color: var(--white);
          color: var(--black);
        }

        /* Esikatselu */
        .preview-box {
          background: #fff;
          padding: 10px;
          border-left: 5px solid var(--dark-blue);
          margin-bottom: 15px;
          font-size: 0.9rem;
          color: #333;
        }

        table {
          width: 100%;
          border-collapse: collapse;
          margin-top: 10px;
        }

        th, td {
          padding: 10px;
          text-align: center;
          border: 1px solid #ccc;
        }

        th {
          background-color: var(--dark-blue);
          color: var(--white);
          font-weight: bold;
        }

        tbody tr:nth-child(odd) td.minuutti-solu {
          background-color: #FFFFFF;
        }

        tbody tr:nth-child(even) td.minuutti-solu {
          background-color: #D2F0FF;
        }

        .p-laatikko {
          display: inline-block;
          background-color: #ffffff;
          color: #000000;
          border: 2px solid #ffffff;
          padding: 2px 6px;
          font-weight: bold;
          border-radius: 4px;
          margin-right: 8px;
        }

        .seliteteksti {
          margin-top: 10px;
          font-size: 0.9rem;
          color: #000000;
          background-color: #ffffff;
          padding: 5px 0;
          text-align: left;
        }
    </style>
</head>
